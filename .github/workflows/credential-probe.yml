name: Build dummy credential probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build x64 Windows probe
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio discovery tool not found.' }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio installation not found.' }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd)) { throw 'Visual Studio developer command setup not found.' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $build = 'call "{0}" -no_logo -arch=amd64 -host_arch=amd64 && cl /nologo /W4 /WX /O2 /DUNICODE /D_UNICODE tools\credential-probe\credential_probe.c /link Advapi32.lib /out:dist\credential-manager-probe.exe' -f $devCmd
          & $env:ComSpec /d /s /c $build
          if ($LASTEXITCODE -ne 0) { throw "Probe build failed with exit code $LASTEXITCODE" }

      - name: Upload probe executable
        uses: actions/upload-artifact@v4
        with:
          name: madeira-dummy-credential-probe
          path: dist/credential-manager-probe.exe
          if-no-files-found: error
