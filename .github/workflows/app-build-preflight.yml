name: Madeira iOS dependencies and app compile check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ffmpeg:
    name: Build FFmpeg libraries
    uses: ./.github/workflows/ffmpeg-ios-build.yml

  build-pairing:
    name: Build iOS pairing library
    uses: ./.github/workflows/rppairing-ios-build.yml

  build-fex:
    name: Build FEX iOS libraries
    uses: ./.github/workflows/fex-ios-build.yml

  build-dxmt:
    name: Build DXMT iOS ARM64 graphics library
    uses: ./.github/workflows/dxmt-ios-build.yml

  build-wine-unix:
    name: Build Wine Unix-side libraries
    needs: build-ffmpeg
    uses: ./.github/workflows/wine-unix-ios-build.yml

  preflight:
    name: iOS prerequisite audit and incomplete app compile check
    needs: [build-ffmpeg, build-pairing, build-fex, build-dxmt, build-wine-unix]
    if: always()
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode with iOS 26 SDK support
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Download FFmpeg libraries from this workflow run
        if: ${{ needs.build-ffmpeg.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-ios-arm64
          path: .

      - name: Download iOS pairing library from this workflow run
        if: ${{ needs.build-pairing.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: madeira-rppairing-ios-arm64
          path: app/Madeira

      - name: Download FEX iOS libraries from this workflow run
        if: ${{ needs.build-fex.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fex-ios-arm64
          path: FEX/build-ios

      - name: Download DXMT iOS library from this workflow run
        if: ${{ needs.build-dxmt.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: dxmt-ios-arm64
          path: app/Madeira

      - name: Download Wine Unix-side libraries from this workflow run
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wine-unix-ios-arm64
          path: app/Madeira

      - name: Stage bundled license copies
        run: bash build/stage-licenses.sh

      - name: Audit app build prerequisites (no compilation)
        run: bash build/preflight-macos.sh

      - name: Check out pinned StikJIT source
        if: ${{ needs.build-ffmpeg.result == 'success' && needs.build-pairing.result == 'success' && needs.build-fex.result == 'success' && needs.build-dxmt.result == 'success' && needs.build-wine-unix.result == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: StikDebug/StikJIT
          ref: 32287268fa5824f9edce4cb359f5833ce0cf7b00
          path: build/_deps/StikJIT
          persist-credentials: false

      - name: Install XcodeGen
        if: ${{ needs.build-ffmpeg.result == 'success' && needs.build-pairing.result == 'success' && needs.build-fex.result == 'success' && needs.build-dxmt.result == 'success' && needs.build-wine-unix.result == 'success' }}
        run: brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build StikJIT XCFramework with the selected Xcode toolchain
        id: build-stikjit
        if: ${{ needs.build-ffmpeg.result == 'success' && needs.build-pairing.result == 'success' && needs.build-fex.result == 'success' && needs.build-dxmt.result == 'success' && needs.build-wine-unix.result == 'success' }}
        env:
          STIKJIT_SOURCE_DIR: build/_deps/StikJIT
          STIKJIT_OUTPUT_DIR: ${{ runner.temp }}/StikJIT.xcframework
          STIKJIT_INSTALL_IN_APP: "1"
        run: bash build/stikjit-ios/build.sh

      - name: Compile unsigned iOS app (optional Microsoft runtime overrides omitted)
        id: compile-app
        if: ${{ needs.build-ffmpeg.result == 'success' && needs.build-pairing.result == 'success' && needs.build-fex.result == 'success' && needs.build-dxmt.result == 'success' && needs.build-wine-unix.result == 'success' && steps.build-stikjit.outcome == 'success' }}
        run: |
          set -euo pipefail
          # The project references this folder as a bundle resource. Keep it
          # empty: the Microsoft DLLs are licensed inputs and are not supplied
          # by this workflow. This compile check is intentionally incomplete.
          mkdir -p app/Madeira/x86_64-vcruntime
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MadeiraDerivedData" \
            LD_GENERATE_MAP_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned Debug IPA (requires sideloader signing)
        if: ${{ steps.compile-app.outcome == 'success' }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MadeiraDerivedData/Build/Products/Debug-iphoneos/Madeira.app"
          PACKAGE_DIR="$RUNNER_TEMP/MadeiraIPAPackage"
          IPA_PATH="$RUNNER_TEMP/Madeira-unsigned-debug.ipa"
          test -d "$APP_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/Madeira.app"
          (cd "$PACKAGE_DIR" && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH")
          IPA_ENTRIES="$(unzip -Z1 "$IPA_PATH")"
          for required_entry in \
            'Payload/Madeira.app/Info.plist' \
            'Payload/Madeira.app/Madeira' \
            'Payload/Madeira.app/PlugIns/MadeiraJITHelper.appex/Info.plist' \
            'Payload/Madeira.app/Frameworks/StikJITSDK.framework/StikJITSDK'; do
            if ! grep -Fxq "$required_entry" <<< "$IPA_ENTRIES"; then
              echo "error: IPA is missing required app/JIT entry: $required_entry" >&2
              exit 1
            fi
          done
          echo 'Verified app executable, plist, embedded JIT helper, and StikJIT framework in the unsigned Debug IPA.'
          echo 'The IPA is not directly installable; a sideloader must sign it, and device/JIT compatibility is unverified.'

      - name: Upload unsigned Debug IPA for sideloading experiments
        if: ${{ steps.compile-app.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: madeira-unsigned-debug-ipa
          path: ${{ runner.temp }}/Madeira-unsigned-debug.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned iOS Release app (optional Microsoft runtime overrides omitted)
        if: ${{ steps.compile-app.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MadeiraDerivedData" \
            LD_GENERATE_MAP_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS linker map for diagnostics
        if: ${{ always() && steps.compile-app.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: madeira-ios-link-map
          path: ${{ runner.temp }}/MadeiraDerivedData/Build/Intermediates.noindex/**/*LinkMap*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Explain compile-only result
        if: ${{ always() && needs.build-ffmpeg.result == 'success' && needs.build-pairing.result == 'success' && needs.build-fex.result == 'success' && needs.build-dxmt.result == 'success' && needs.build-wine-unix.result == 'success' }}
        run: |
          {
            echo '### App compilation scope'
            echo
            echo 'The unsigned iOS target was compiled for source/link validation only. A Debug .ipa ZIP package is uploaded as a short-lived artifact; it is unsigned and is not directly installable until a sideloader signs it.'
            echo 'Optional Microsoft Visual C++ runtime overrides were not included; Wine ARM64EC built-ins remain in the app. This compile-only result does not establish app-specific runtime compatibility or validate a sideload.'
          } >> "$GITHUB_STEP_SUMMARY"
