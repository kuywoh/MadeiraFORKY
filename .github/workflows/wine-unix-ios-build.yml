name: Build Wine Unix-side libraries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wine-unix-ios:
    name: Build Wine Unix-side libraries (iOS arm64)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      JOBS: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode with iOS 26 SDK support
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Initialize pinned Wine source
        run: git submodule update --init --recursive wine

      - name: Check out pinned FreeType source
        uses: actions/checkout@v4
        with:
          repository: freetype/freetype
          ref: 42608f77f20749dd6ddc9e0536788eaad70ea4b5
          path: research/freetype
          persist-credentials: false

      - name: Download FFmpeg iOS headers and libraries
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-ios-arm64
          path: .

      - name: Install Wine build tools
        run: |
          set -euo pipefail
          brew list bison >/dev/null 2>&1 || brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          bison --version
          cmake --version

      - name: Install checksum-pinned llvm-mingw
        run: |
          set -euo pipefail
          mkdir -p toolchains
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  $RUNNER_TEMP/llvm-mingw.tar.xz" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C toolchains
          echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" >> "$GITHUB_PATH"

      - name: Build iOS GnuTLS headers and libraries
        run: bash build/gnutls-ios/build.sh

      - name: Configure Wine aarch64 build tree and generate headers
        run: |
          set -euo pipefail
          mkdir -p wine/build-macos
          (
            cd wine/build-macos
            ../configure --enable-archs=aarch64 --without-x --disable-tests --enable-winegstreamer
          )
          for module in ntdll win32u winegstreamer ieframe d3d11; do
            make -C "wine/build-macos/dlls/$module" -j"$JOBS" "aarch64-windows/$module.dll"
          done
          make -C wine/build-macos/programs/winebrowser -j"$JOBS"
          WINEBROWSER="$(find wine/build-macos/programs/winebrowser -type f -name winebrowser.exe -print -quit)"
          test -n "$WINEBROWSER"
          llvm-readobj --file-headers "$WINEBROWSER" > "$RUNNER_TEMP/winebrowser-readobj.txt"
          grep -Eq 'Machine: IMAGE_FILE_MACHINE_ARM64|Machine: 0xAA64' "$RUNNER_TEMP/winebrowser-readobj.txt"
          mkdir -p app/Madeira/aarch64-windows
          cp "$WINEBROWSER" app/Madeira/aarch64-windows/winebrowser.exe
          make -C wine/build-macos/server -j"$JOBS"

      - name: Build ARM64EC API-set schema, DWrite, DXVA2, and EVR modules
        env:
          DEST: ${{ runner.temp }}/wine-pe
        run: bash build/wine-pe/build-modules.sh apisetschema dwrite dxva2 evr

      - name: Stage Wine API-set schema and EVR modules for the app artifact
        run: |
          set -euo pipefail
          APISET_DLL="$RUNNER_TEMP/wine-pe/apisetschema.dll"
          EVR_DLL="$RUNNER_TEMP/wine-pe/evr.dll"
          DXVA2_DLL="$RUNNER_TEMP/wine-pe/dxva2.dll"
          test -s "$APISET_DLL"
          test -s "$EVR_DLL"
          test -s "$DXVA2_DLL"
          llvm-readobj --file-headers --sections "$APISET_DLL" > "$RUNNER_TEMP/apisetschema-readobj.txt"
          llvm-readobj --file-headers --coff-exports "$EVR_DLL" > "$RUNNER_TEMP/evr-readobj.txt"
          llvm-readobj --file-headers --coff-exports "$DXVA2_DLL" > "$RUNNER_TEMP/dxva2-readobj.txt"
          grep -Fq '.apiset' "$RUNNER_TEMP/apisetschema-readobj.txt"
          grep -Eq 'Machine: IMAGE_FILE_MACHINE_ARM64EC|Machine: 0xA641' "$RUNNER_TEMP/evr-readobj.txt"
          grep -Eq 'Machine: IMAGE_FILE_MACHINE_ARM64EC|Machine: 0xA641' "$RUNNER_TEMP/dxva2-readobj.txt"
          grep -Fq 'MFCreateVideoSampleFromSurface' "$RUNNER_TEMP/evr-readobj.txt"
          mkdir -p app/Madeira/arm64ec-windows
          cp "$APISET_DLL" app/Madeira/arm64ec-windows/apisetschema.dll
          cp "$EVR_DLL" app/Madeira/arm64ec-windows/evr.dll
          cp "$DXVA2_DLL" app/Madeira/arm64ec-windows/dxva2.dll
          echo 'Verified Wine API-set schema has a .apiset section; EVR and DXVA2 are ARM64EC PEs, and EVR exports MFCreateVideoSampleFromSurface.'

      - name: Build iOS FreeType library
        run: bash build/freetype-ios/build.sh

      - name: Build Wine ntdll Unix-side library
        continue-on-error: true
        run: bash build/ntdll-unix/build.sh

      - name: Build Wine win32u Unix-side library
        continue-on-error: true
        run: bash build/win32u-unix/build.sh

      - name: Build Wine server library
        continue-on-error: true
        run: bash build/wineserver/build.sh

      - name: Verify generated iOS arm64 libraries
        if: always()
        run: |
          set -euo pipefail
          for library in app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a app/Madeira/libwineserver.a; do
            test -s "$library"
            xcrun --sdk iphoneos lipo -info "$library"
            shasum -a 256 "$library"
          done

      - name: Upload Wine Unix-side libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-unix-ios-arm64
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/arm64ec-windows/dxva2.dll
            app/Madeira/arm64ec-windows/evr.dll
            app/Madeira/arm64ec-windows/apisetschema.dll
            app/Madeira/aarch64-windows/winebrowser.exe
          if-no-files-found: ignore
          retention-days: 14
